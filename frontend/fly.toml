# Fly.io config for the Aerosol Lens frontend (static, nginx).
# Deploy with: fly deploy -c fly.toml -a aerosol-lens (run from frontend/)
app = "aerosol-lens"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
