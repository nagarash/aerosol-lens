<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aerosol Lens</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link href="styles.css" rel="stylesheet" />
</head>
<body>
  <div id="map"></div>

  <!-- Basemap picker -->
  <select id="basemap-select" class="panel" title="Basemap">
    <option value="satellite">Satellite</option>
    <option value="streets">Streets</option>
    <option value="natgeo">NatGeo</option>
    <option value="ocean">Ocean</option>
    <option value="terrain">Terrain</option>
    <option value="light">Light</option>
    <option value="dark">Dark</option>
    <option value="positron">Positron</option>
    <option value="bright">Bright</option>
  </select>

  <!-- Backend / grid errors, in plain language -->
  <div id="error-banner" class="hidden"></div>

  <!-- Loading indicator for ask + (cold) grid fetches -->
  <div id="loading" class="hidden">
    <div class="spinner"></div>
    <span id="loading-label">Loading…</span>
  </div>

  <!-- Legend: data-driven colorbar for aerosol grids -->
  <div id="legend" class="panel">
    <div id="legend-title">Aerosol Lens</div>
    <div id="legend-bar"></div>
    <div id="legend-labels">
      <span id="legend-min"></span><span id="legend-mid"></span><span id="legend-max"></span>
    </div>
    <div id="legend-meta"></div>
    <div id="legend-guideline"></div>
  </div>

  <!-- Time scrubber (stub: wired to frame prefetching later) -->
  <div id="timebar" class="panel">
    <button id="play-btn" title="Play animation">▶</button>
    <input id="time-slider" type="range" min="0" max="0" value="0" />
    <span id="time-label"></span>
  </div>

  <!-- Chat: natural language -> QueryPlan -->
  <div id="chat" class="panel">
    <form id="chat-form">
      <input id="chat-input" type="text" autocomplete="off"
             placeholder="e.g. Show me the Saharan dust plume / Dust over Delhi" />
      <button type="submit">Ask</button>
    </form>
    <div id="chat-log"></div>
    <div id="chat-caption"></div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="config.js"></script>
  <script src="js/grid-render.js?v=4"></script>
  <script src="app11.js"></script>
</body>
</html>
