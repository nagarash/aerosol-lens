<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aerosol Lens</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link href="styles.css" rel="stylesheet" />
</head>
<body>
  <div id="map"></div>

  <!-- Mode toggle: never mix surface and column in one view -->
  <div id="mode-toggle" class="panel">
    <button data-mode="health" class="active">Air quality</button>
    <button data-mode="plume">Plume view</button>
  </div>

  <!-- Basemap picker -->
  <select id="basemap-select" class="panel" title="Basemap">
    <option value="satellite">Satellite</option>
    <option value="streets">Streets</option>
    <option value="light">Light</option>
    <option value="dark">Dark</option>
  </select>

  <!-- Settings: bring-your-own Google Air Quality API key (localStorage only) -->
  <button id="settings-btn" class="panel" title="Settings">⚙</button>
  <div id="settings" class="panel hidden">
    <div class="settings-head">
      <strong>Settings</strong>
      <button id="settings-close" title="Close">✕</button>
    </div>
    <label for="settings-key">Google Air Quality API key</label>
    <input id="settings-key" type="password" autocomplete="off"
           placeholder="Paste your key" />
    <div class="settings-row">
      <button id="settings-save">Save</button>
      <button id="settings-clear">Clear</button>
    </div>
    <p class="settings-note">
      The key stays in this browser and is only ever sent to Google.
      Get one at
      <a href="https://console.cloud.google.com/" target="_blank" rel="noopener">Google Cloud Console</a>
      (enable the <em>Air Quality API</em>).
    </p>
  </div>

  <!-- Backend / grid errors, in plain language -->
  <div id="error-banner" class="hidden"></div>

  <!-- Loading indicator for ask + (cold) grid fetches -->
  <div id="loading" class="hidden">
    <div class="spinner"></div>
    <span id="loading-label">Loading…</span>
  </div>

  <!-- Legend: data-driven colorbar for plume grids, US-AQI scale for live air quality -->
  <div id="legend" class="panel">
    <div id="legend-title">Aerosol Lens</div>
    <div id="legend-bar"></div>
    <div id="legend-labels">
      <span id="legend-min"></span><span id="legend-mid"></span><span id="legend-max"></span>
    </div>
    <div id="legend-meta"></div>
    <div id="legend-guideline"></div>
  </div>

  <!-- Time scrubber (stub: wired to frame prefetching later) -->
  <div id="timebar" class="panel">
    <button id="play-btn" title="Play animation">▶</button>
    <input id="time-slider" type="range" min="0" max="0" value="0" />
    <span id="time-label"></span>
  </div>

  <!-- Chat: natural language -> QueryPlan -->
  <div id="chat" class="panel">
    <div id="chat-log"></div>
    <form id="chat-form">
      <input id="chat-input" type="text" autocomplete="off"
             placeholder="e.g. Is it safe to run in Delhi today? / Show me the Saharan dust plume" />
      <button type="submit">Ask</button>
    </form>
    <div id="chat-caption"></div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="config.js"></script>
  <script src="js/grid-render.js"></script>
  <script src="app.js"></script>
</body>
</html>
